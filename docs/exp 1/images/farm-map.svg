<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="map-title">
  <title id="map-title">Farm layout map showing Plot A, Plot B, and Plot C</title>
  <defs>
    <!-- crop-row stripes, one per growth stage -->
    <pattern id="rowsA" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#2e7d32"/>
      <rect width="6" height="14" fill="#1b5e20"/>
    </pattern>
    <pattern id="rowsB" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#8bc34a"/>
      <rect width="6" height="14" fill="#689f38"/>
    </pattern>
    <pattern id="rowsC" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#d4b94a"/>
      <rect width="6" height="14" fill="#b89b2e"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="600" height="400" fill="#e8dcc0"/>

  <!-- irrigation canals between plots -->
  <rect x="190" y="0" width="20" height="400" fill="#4fc3f7"/>
  <rect x="390" y="0" width="20" height="400" fill="#4fc3f7"/>
  <rect x="193" y="0" width="2" height="400" fill="#81d4fa"/>
  <rect x="393" y="0" width="2" height="400" fill="#81d4fa"/>

  <!-- plots (these rectangles match the clickable image-map areas) -->
  <rect x="10" y="10" width="180" height="380" fill="url(#rowsA)" stroke="#1b5e20" stroke-width="3"/>
  <rect x="210" y="10" width="180" height="380" fill="url(#rowsB)" stroke="#33691e" stroke-width="3"/>
  <rect x="410" y="10" width="180" height="380" fill="url(#rowsC)" stroke="#8d6e0f" stroke-width="3"/>

  <!-- Plot A label -->
  <rect x="25" y="150" width="150" height="90" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <text x="100" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1b5e20">Plot A</text>
  <text x="100" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Grand Growth</text>
  <text x="100" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Moisture 28%</text>

  <!-- Plot B label -->
  <rect x="225" y="150" width="150" height="90" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <text x="300" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#33691e">Plot B</text>
  <text x="300" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Tillering</text>
  <text x="300" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Moisture 40%</text>

  <!-- Plot C label -->
  <rect x="425" y="150" width="150" height="90" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <text x="500" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#6d5200">Plot C</text>
  <text x="500" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Maturity</text>
  <text x="500" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">Moisture 33%</text>

  <!-- compass -->
  <g transform="translate(560,50)">
    <circle r="16" fill="#ffffff" fill-opacity="0.92" stroke="#555"/>
    <path d="M0,-11 L5,5 L0,2 L-5,5 Z" fill="#c62828"/>
    <text y="-19" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#222">N</text>
  </g>
</svg>
