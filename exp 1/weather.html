<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Forecast - AgriSense AI</title>
<style>
  :root{
    --primary:#2e7d32;
    --primary-dark:#1b5e20;
    --secondary:#0277bd;
    --bg:#f4f8f4;
    --card-bg:#ffffff;
    --text:#222;
    --muted:#666;
    --border:#cfd8cf;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI', Arial, sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  header{background:linear-gradient(90deg,var(--primary-dark),var(--primary));color:#fff;padding:1.5rem 2rem;}
  header h1{margin:0 0 .3rem 0;font-size:1.8rem;}
  header p{margin:0;font-size:1rem;opacity:.9;}
  nav{background:var(--primary-dark);padding:.7rem 2rem;}
  nav a{color:#fff;text-decoration:none;margin-right:1.5rem;font-weight:600;font-size:.95rem;}
  nav a:hover{text-decoration:underline;}
  main{max-width:1000px;margin:2rem auto;padding:0 1.5rem;}
  section, article, aside{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem;}
  aside{border-left:4px solid var(--secondary);background:#eef6fb;}
  h2{color:var(--primary-dark);}
  footer{text-align:center;padding:1.2rem;background:var(--primary-dark);color:#fff;margin-top:2rem;}
  table{border-collapse:collapse;width:100%;}
  table, th, td{border:1px solid var(--border);}
  th, td{padding:.6rem .8rem;text-align:left;}
  thead th{background:var(--primary);color:#fff;}
  tbody tr:nth-child(even){background:#f0f6f0;}
  tfoot{font-weight:bold;background:#e0ede0;}
  caption{font-weight:bold;margin-bottom:.5rem;color:var(--primary-dark);}
  fieldset{border:1px solid var(--border);border-radius:8px;padding:1.2rem;}
  legend{padding:0 .5rem;font-weight:bold;color:var(--primary-dark);}
  label{display:block;margin-top:.8rem;font-weight:600;}
  input, select, textarea{width:100%;padding:.5rem;margin-top:.3rem;border:1px solid var(--border);border-radius:4px;font-size:1rem;}
  input[type="radio"]{width:auto;margin-right:.4rem;}
  button, input[type="submit"]{margin-top:1.2rem;background:var(--primary);color:#fff;border:none;padding:.7rem 1.5rem;border-radius:4px;font-size:1rem;cursor:pointer;}
  button:hover, input[type="submit"]:hover{background:var(--primary-dark);}
  figure{display:inline-block;margin:1rem;text-align:center;}
  figcaption{margin-top:.4rem;font-style:italic;color:var(--muted);}
  mark{background:#ffe08a;padding:0 .2rem;}
  iframe{border:1px solid var(--border);border-radius:6px;}
  .iframe-block{margin-bottom:1.5rem;}
</style>
</head>
<body>
<header>
  <h1>AgriSense AI</h1>
  <p>Smart Irrigation using AI &amp; Sensor Technology</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="farm-info.html">Farm Dashboard</a>
  <a href="advisory.html">Irrigation Advisory</a>
  <a href="irrigation-table.html">Sensor Data</a>
  <a href="index.html#contact">Contact</a>
</nav>

<main>
  <section>
    <h2>Today's Weather Forecast</h2>

    <div class="iframe-block">
      <h3>IMD Weather Forecast</h3>
      <iframe src="https://example.com/imd/forecast/farm-region" width="100%" height="350" title="IMD Weather Forecast for Farm Region"></iframe>
    </div>

    <div class="iframe-block">
      <h3>Farm Location Map</h3>
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d0!2d0!3d0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1" width="100%" height="350" title="Google Maps view of farm location" loading="lazy"></iframe>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2026 AgriSense AI Smart Irrigation Advisory Portal. All rights reserved.</p>
</footer>
</body>
</html>
