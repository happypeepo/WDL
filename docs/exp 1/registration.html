<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Registration - AgriSense AI</title>
<link rel="stylesheet" href="../exp 2/style.css">
<link rel="stylesheet" href="../exp 2/nav.css">
<link rel="stylesheet" href="../exp 2/form.css">
<style>
  :root{
    --primary:#2e7d32;
    --primary-dark:#1b5e20;
    --secondary:#0277bd;
    --bg:#f4f8f4;
    --card-bg:#ffffff;
    --text:#222;
    --muted:#666;
    --border:#cfd8cf;
  }
  *{box-sizing:border-box;}
  header{background:linear-gradient(90deg,var(--primary-dark),var(--primary));color:#fff;padding:1.5rem 2rem;}
  header h1{margin:0 0 .3rem 0;font-size:1.8rem;color:#fff;}
  header p{margin:0;font-size:1rem;opacity:.9;}
  main{max-width:1000px;margin:2rem auto;padding:0 1.5rem;}
  section, article{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem;}
  label{display:block;margin-top:.8rem;font-weight:600;}
  .radio-group label{display:inline-block;font-weight:normal;margin-right:1rem;margin-top:.4rem;}
  .radio-group{margin-top:.8rem;}
  .radio-title{font-weight:600;margin-top:.8rem;}
</style>
</head>
<body>
<header>
  <h1>AgriSense AI</h1>
  <p>Smart Irrigation using AI &amp; Sensor Technology</p>
</header>

<nav class="main-nav">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="farm-info.html">Farm Dashboard</a></li>
    <li><a href="advisory.html">Irrigation Advisory</a></li>
    <li><a href="irrigation-table.html">Sensor Data</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<main>
  <section>
    <h2>Farmer Registration</h2>
    <div id="form-success" class="success" role="status" hidden></div>
    <form id="regForm" action="#" method="post" novalidate>
      <fieldset>
        <legend>Farmer &amp; Plot Details</legend>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required autofocus>

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="plotid">Plot ID</label>
        <input type="text" id="plotid" name="plotid" placeholder="e.g. PLT-106" required>

        <label for="village">Village</label>
        <input type="text" id="village" name="village" placeholder="Enter village name" required>

        <p class="radio-title">Crop Stage</p>
        <div class="radio-group">
          <label><input type="radio" name="cropstage" value="germination" required> Germination</label>
          <label><input type="radio" name="cropstage" value="tillering"> Tillering</label>
          <label><input type="radio" name="cropstage" value="grandgrowth"> Grand Growth</label>
          <label><input type="radio" name="cropstage" value="maturity"> Maturity</label>
        </div>

        <label for="soiltype">Soil Type</label>
        <select id="soiltype" name="soiltype" required>
          <option value="">-- Select Soil Type --</option>
          <option value="clay">Clay</option>
          <option value="sandy">Sandy</option>
          <option value="loamy">Loamy</option>
          <option value="clayloam">Clay Loam</option>
        </select>

        <p class="radio-title">Irrigation Method</p>
        <div class="radio-group">
          <label><input type="radio" name="irrigationmethod" value="drip" required> Drip</label>
          <label><input type="radio" name="irrigationmethod" value="sprinkler"> Sprinkler</label>
          <label><input type="radio" name="irrigationmethod" value="flood"> Flood</label>
        </div>

        <label for="regdate">Registration Date</label>
        <input type="date" id="regdate" name="regdate" required>

        <label for="farmphoto">Upload Farm Photo</label>
        <input type="file" id="farmphoto" name="farmphoto" accept="image/*">

        <button type="submit">Register</button>
      </fieldset>
    </form>
  </section>
</main>

<footer>
  <p>&copy; 2026 AgriSense AI Smart Irrigation Advisory Portal. All rights reserved.</p>
</footer>

<script>
(function () {
  var form = document.getElementById("regForm");
  var success = document.getElementById("form-success");

  function byId(id) { return document.getElementById(id); }

  // Local-time YYYY-MM-DD, so "today" is correct regardless of timezone.
  function todayString() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  // Show (or clear, when message is "") the error text right after a field.
  function setError(el, message) {
    var err = el.nextElementSibling;
    if (!err || !err.classList.contains("error")) {
      err = document.createElement("span");
      err.className = "error";
      err.setAttribute("role", "alert");
      el.insertAdjacentElement("afterend", err);
    }
    err.textContent = message;
    el.classList.toggle("invalid", message !== "");
    if (!el.classList.contains("radio-group")) {
      el.setAttribute("aria-invalid", message !== "" ? "true" : "false");
    }
  }

  var fields = [
    { el: byId("name"), check: function () {
        var v = byId("name").value.trim();
        if (v === "") return "Please enter your full name.";
        if (v.length < 3) return "Name must be at least 3 characters.";
        if (!/^[A-Za-z][A-Za-z .'-]*$/.test(v)) return "Name can only contain letters, spaces, . ' and -.";
        return "";
    }},
    { el: byId("mobile"), check: function () {
        var v = byId("mobile").value.trim();
        if (v === "") return "Please enter your mobile number.";
        if (!/^\d{10}$/.test(v)) return "Mobile number must be exactly 10 digits.";
        if (!/^[6-9]/.test(v)) return "Mobile number must start with 6, 7, 8 or 9.";
        return "";
    }},
    { el: byId("email"), check: function () {
        var v = byId("email").value.trim();
        if (v === "") return "Please enter your email address.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return "Enter a valid email, e.g. you@example.com.";
        return "";
    }},
    { el: byId("plotid"), check: function () {
        var v = byId("plotid").value.trim();
        if (v === "") return "Please enter your Plot ID.";
        if (!/^PLT-\d{3,}$/i.test(v)) return "Plot ID must look like PLT-106.";
        return "";
    }},
    { el: byId("village"), check: function () {
        var v = byId("village").value.trim();
        if (v === "") return "Please enter your village name.";
        if (!/^[A-Za-z][A-Za-z .'-]+$/.test(v)) return "Village name can only contain letters and spaces.";
        return "";
    }},
    { el: form.querySelector('input[name="cropstage"]').closest(".radio-group"), check: function () {
        return form.elements.cropstage.value === "" ? "Please select a crop stage." : "";
    }},
    { el: byId("soiltype"), check: function () {
        return byId("soiltype").value === "" ? "Please select a soil type." : "";
    }},
    { el: form.querySelector('input[name="irrigationmethod"]').closest(".radio-group"), check: function () {
        return form.elements.irrigationmethod.value === "" ? "Please select an irrigation method." : "";
    }},
    { el: byId("regdate"), check: function () {
        var v = byId("regdate").value;
        if (v === "") return "Please choose a registration date.";
        if (v > todayString()) return "Registration date cannot be in the future.";
        return "";
    }},
    { el: byId("farmphoto"), check: function () {
        var file = byId("farmphoto").files[0];
        if (!file) return ""; // photo is optional
        if (file.type.indexOf("image/") !== 0) return "Please upload an image file.";
        if (file.size > 5 * 1024 * 1024) return "Image must be 5 MB or smaller.";
        return "";
    }}
  ];

  function validate(f) {
    var message = f.check();
    setError(f.el, message);
    return message === "";
  }

  // Validate as the user moves through the form.
  fields.forEach(function (f) {
    var usesChange = f.el.classList.contains("radio-group") ||
                     f.el.tagName === "SELECT" || f.el.type === "file" || f.el.type === "date";
    if (usesChange) {
      f.el.addEventListener("change", function () { validate(f); });
    } else {
      f.el.addEventListener("blur", function () { validate(f); });
      // Once a field is flagged, clear the error as soon as it's fixed.
      f.el.addEventListener("input", function () {
        if (f.el.classList.contains("invalid")) validate(f);
      });
    }
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    success.hidden = true;

    var firstInvalid = null;
    fields.forEach(function (f) {
      if (!validate(f) && !firstInvalid) firstInvalid = f.el;
    });

    if (firstInvalid) {
      var target = firstInvalid.classList.contains("radio-group")
        ? firstInvalid.querySelector("input") : firstInvalid;
      target.focus();
      return;
    }

    // No backend yet: confirm on the page instead of posting anywhere.
    success.textContent = "Thank you, " + byId("name").value.trim() +
                          "! Your registration has been submitted.";
    success.hidden = false;
    form.reset();
    success.scrollIntoView({ behavior: "smooth", block: "start" });
  });
})();
</script>
</body>
</html>
